<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slide Toggle Example</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    button {
      padding: 12px 24px;
      background-color: #007BFF;
      color: white;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #0056b3;
    }

    .sliding-box {
      height: 400px;
      width: 80%;
      max-width: 600px;
      background-color: #ff4d4d;
      margin-top: 20px;
      display: none;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }

    h1 {
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
    }
  </style>
</head>

<body>
  <button id="btn">Slide Down/Up</button>
  <div class="sliding-box">
    <h1>Demo Deployment</h1>
  </div>

  <script src="./jquery-3.7.1.min.js"></script>
  <script>
    $(function () {
      $("#btn").click(function () {
        $(".sliding-box").slideToggle(1000);
      });
    });
  </script>
</body>

</html>
